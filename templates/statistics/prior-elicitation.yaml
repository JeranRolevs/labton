# Draft: copy into setup/priors/, replace placeholders, and supply real local evidence.
# Numerical candidates and check cutoffs below are illustrative, not recommended priors.
schema_version: 1
target:
  id: run_false_alarms
  parameter: Probability of any false alarm in a fixed-horizon independent benign run at primary alpha 0.1
  population: <define the synthetic mechanisms, horizon and policies to which the evidence applies>
  observation_unit: independent_run
  success_definition: At least one score exceeds the independently calibrated threshold
likelihood: binomial
candidates:
  - {id: broad, family: beta, a: 1, b: 1, rationale: "<justify a broad reference alternative>"}
  - {id: cautious, family: beta, a: 1, b: 9, rationale: "<justify this mean and concentration from prior-only evidence>"}
  - {id: stronger, family: beta, a: 2, b: 18, rationale: "<justify a stronger information alternative>"}
evidence:
  prior:
    - id: external-prior-evidence
      file: setup/priors/evidence/prior-extract.md
      dataset_id: <stable identity of the external dataset>
      observation_ids: []  # List known units; empty means unresolved for a shared dataset.
      lineage_ids: []      # List identities of underlying observations/derivatives when applicable.
      relevance: <assess population, measurement unit, policy differences and limitations>
  validation:
    - id: independent-validation
      file: setup/priors/evidence/validation-counts.json
      dataset_id: <stable identity of the independent check dataset>
      observation_ids: []
      lineage_ids: []
      relevance: <explain independence and applicability to this binomial parameter>
      counts: {successes: null, trials: null}  # Fill with actual file-backed integer counts.
  likelihood:
    - id: reserved-memory-panels
      file: mission/memory/private_splits.json
      dataset_id: <stable identity of the reserved panels>
      observation_ids: []
      lineage_ids: []
      relevance: All actual development, calibration and protected confirmation panels
    - id: measurement-protocol
      file: mission/memory/evaluation-smoke.yaml  # Use the actual runtime.domain_config path.
      dataset_id: measurement-protocol
      observation_ids: []
      lineage_ids: []
      relevance: Fixed generator, horizon, measurement definitions and sampling counts
checks:
  predictive_trials: 20
  plausible_rate_range: [0, 0.5]
  max_outside_mass: 0.1
  min_validation_tail: 0.01
  posterior_threshold: 0.1
  decision_probability: 0.95
  material_mean_shift: 0.05
